name: Build macOS DMG release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - '.github/RELEASE_VERSION'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, for example v0.3.2'
        required: true
        type: string

permissions:
  contents: write

env:
  FOLIO_CODESIGN_IDENTITY: ${{ secrets.FOLIO_CODESIGN_IDENTITY }}
  MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
  MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
  APPLE_ID: ${{ secrets.APPLE_ID }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION='${{ inputs.version }}'
          else
            VERSION="$(tr -d '[:space:]' < .github/RELEASE_VERSION)"
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          VERSION_NUMBER="${VERSION#v}"
          ASSET="Folio-${VERSION_NUMBER}-macOS-arm64.dmg"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_number=$VERSION_NUMBER" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "checksum=${ASSET}.sha256" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION -> $ASSET"

      - name: Install build dependencies
        run: |
          brew install python@3.12 djvulibre
          /opt/homebrew/bin/python3.12 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt pyinstaller==6.16.0 dmgbuild==1.6.7

      - name: Import Developer ID certificate when configured
        if: env.MACOS_CERTIFICATE != ''
        run: |
          CERT_PATH="$RUNNER_TEMP/folio.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/folio-signing.keychain-db"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p actions "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p actions "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN_PATH"

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv/bin/python -m unittest discover -s tests -v

      - name: Build standalone app and DMG
        run: |
          .venv/bin/python build_macos.py --dmg --output dist
          mv dist/Folio-macOS-arm64.dmg "dist/${{ steps.version.outputs.asset }}"

      - name: Create checksum
        run: |
          cd dist
          shasum -a 256 "${{ steps.version.outputs.asset }}" > "${{ steps.version.outputs.checksum }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ASSET: ${{ steps.version.outputs.asset }}
          CHECKSUM: ${{ steps.version.outputs.checksum }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; replacing its DMG assets."
            gh release upload "$VERSION" \
              "dist/$ASSET" \
              "dist/$CHECKSUM" \
              --clobber
          else
            gh release create "$VERSION" \
              "dist/$ASSET" \
              "dist/$CHECKSUM" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "Folio ${VERSION#v}"
          fi
