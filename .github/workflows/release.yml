name: Build macOS DMG release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FOLIO_CODESIGN_IDENTITY: ${{ secrets.FOLIO_CODESIGN_IDENTITY }}
  MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
  MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
  APPLE_ID: ${{ secrets.APPLE_ID }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install python@3.12 djvulibre
          /opt/homebrew/bin/python3.12 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt pyinstaller==6.16.0

      - name: Import Developer ID certificate when configured
        if: env.MACOS_CERTIFICATE != ''
        run: |
          CERT_PATH="$RUNNER_TEMP/folio.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/folio-signing.keychain-db"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p actions "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p actions "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN_PATH"

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv/bin/python -m unittest discover -s tests -v

      - name: Build standalone app and DMG
        run: .venv/bin/python build_macos.py --dmg --output dist

      - name: Create checksum
        run: shasum -a 256 dist/Folio-macOS-arm64.dmg > dist/Folio-macOS-arm64.dmg.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Folio-macOS-arm64.dmg \
            dist/Folio-macOS-arm64.dmg.sha256 \
            --generate-notes \
            --title "Folio ${GITHUB_REF_NAME#v}"
