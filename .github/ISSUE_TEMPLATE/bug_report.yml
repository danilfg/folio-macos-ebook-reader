name: Bug report
description: Report a reproducible Lexumi problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a Lexumi bug. Do not attach private or copyrighted books unless you have permission to share them.
  - type: input
    id: version
    attributes:
      label: Lexumi version
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS and Mac model
      placeholder: macOS 15.x, MacBook Pro M1 Max
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Document format
      options: [PDF, DjVu, EPUB, FB2, MOBI/PRC, XPS/OXPS, CBZ, TXT, Image, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
